<h2>{{ frage["frage"] }}</h2>

{% if frage["bild"] %}
    <img src="{{ frage['bild'] }}" style="max-width:300px;">
{% endif %}

<form method="POST">
    {% for a in antworten %}
        <label>
            <input type="radio" name="antwort" value="{{ a['kategorie'] }}" required>
            {{ a["text"] }}
        </label><br>
    {% endfor %}

    <button type="submit">Weiter</button>
</form>
